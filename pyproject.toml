[project]
name = "infinite-synthwave"
version = "0.1.0"
description = "Infinite procedural synthwave generator with programmable synths, CLI and MCP server"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.0", "scipy>=1.14", "sounddevice>=0.5", "soundfile>=0.12",
  "pyyaml>=6.0", "pydantic>=2.7", "mcp>=2.0", "typer>=0.12",
]
[project.scripts]
synthwave = "synthwave.cli:app"
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["synthwave"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
[tool.pytest.ini_options]
testpaths = ["tests"]
