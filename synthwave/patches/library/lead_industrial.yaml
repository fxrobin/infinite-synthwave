name: lead_industrial
polyphony: 2
glide: 0.06
volume: 1.6
oscillators:
  - {wave: fm, fm_ratio: 2.0, fm_index: 2.5, level: 0.6}
  - {wave: saw, unison: 2, detune: 12, level: 0.5}
  - {wave: square, octave: -1, pwm: 0.2, level: 0.3}
amp_env: {attack: 0.01, decay: 0.5, sustain: 0.6, release: 0.6}
filter:
  type: lp
  cutoff: 1400
  resonance: 0.3
  env: {attack: 0.005, decay: 0.4, sustain: 0.3, release: 0.4, amount: 1800}
lfo: {wave: sine, rate: 5.0, target: pitch, amount: 0.1}
effects:
  - {type: distortion, drive: 5.0, tone: 3500, mix: 0.7}
  - {type: delay, time: "1/8d", feedback: 0.5, mix: 0.4, pingpong: true}
  - {type: reverb, size: 0.9, damping: 0.6, mix: 0.35}
