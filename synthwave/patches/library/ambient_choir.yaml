name: ambient_choir
polyphony: 3
volume: 0.5
oscillators:
  - {wave: triangle, unison: 4, detune: 10, level: 0.6, spread: 1.0}
  - {wave: square, pwm: 0.45, level: 0.2}
  - {wave: sine, octave: -1, level: 0.35}
amp_env: {attack: 4.0, decay: 1.0, sustain: 0.9, release: 5.0}
filter:
  type: lp
  cutoff: 1500
  resonance: 0.15
lfo: {wave: sine, rate: 0.12, target: cutoff, amount: 400}
effects:
  - {type: flanger, rate: 0.08, depth: 0.003, base: 0.005, feedback: 0.4, mix: 0.4}
  - {type: chorus, rate: 0.3, depth: 0.006, mix: 0.5}
  - {type: reverb, size: 1.0, damping: 0.5, mix: 0.6, predelay: 0.05}
