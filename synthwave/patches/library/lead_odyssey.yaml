# ARP Odyssey — duophonique, tranchant : saw + pulse fine, résonance forte, un peu de FM pour le sync.
name: lead_odyssey
polyphony: 2
glide: 0.04
volume: 0.75
oscillators:
  - {wave: saw, level: 0.55}
  - {wave: square, pwm: 0.2, semi: 7, level: 0.3}
  - {wave: fm, fm_ratio: 2.0, fm_index: 1.2, level: 0.3}
amp_env: {attack: 0.01, decay: 0.35, sustain: 0.75, release: 0.3}
filter:
  type: lp
  cutoff: 1000
  resonance: 0.5
  env: {attack: 0.01, decay: 0.45, sustain: 0.35, release: 0.3, amount: 2600}
lfo: {wave: sine, rate: 6.0, target: pitch, amount: 0.15}
effects:
  - {type: distortion, drive: 3.0, tone: 4000, mix: 0.5}
  - {type: phaser, rate: 0.3, depth: 0.7, stages: 4, mix: 0.35}
  - {type: delay, time: "1/8", feedback: 0.4, mix: 0.3, pingpong: true}
  - {type: reverb, size: 0.85, damping: 0.55, mix: 0.25}
