# Roland Jupiter-8 — lead large et brillant : saw + pulse en unisson, chorus stéréo.
name: lead_jupiter
polyphony: 1
glide: 0.04
volume: 1.5
oscillators:
  - {wave: saw, unison: 3, detune: 12, level: 0.6, spread: 0.8}
  - {wave: square, pwm: 0.4, level: 0.4}
  - {wave: saw, octave: -1, level: 0.25}
amp_env: {attack: 0.02, decay: 0.4, sustain: 0.8, release: 0.45}
filter:
  type: lp
  cutoff: 1300
  resonance: 0.18
  env: {attack: 0.02, decay: 0.7, sustain: 0.55, release: 0.4, amount: 1700}
lfo: {wave: sine, rate: 5.2, target: pitch, amount: 0.12}
effects:
  - {type: chorus, rate: 0.45, depth: 0.0035, mix: 0.4}
  - {type: delay, time: "1/4", feedback: 0.4, mix: 0.3, pingpong: true}
  - {type: reverb, size: 0.88, damping: 0.5, mix: 0.3}
