name: pad_cs80
polyphony: 6
volume: 0.6
oscillators:
  - {wave: saw, unison: 2, detune: 6, level: 0.5}
  - {wave: square, pwm: 0.5, level: 0.3}
  - {wave: sine, octave: 1, level: 0.15}
amp_env: {attack: 1.4, decay: 1.0, sustain: 0.9, release: 3.0}
filter:
  type: lp
  cutoff: 700
  resonance: 0.15
  env: {attack: 2.5, decay: 2.0, sustain: 0.6, release: 2.5, amount: 1800}
lfo: {wave: sine, rate: 0.35, target: cutoff, amount: 300}
effects:
  - {type: chorus, rate: 0.35, depth: 0.005, mix: 0.45}
  - {type: delay, time: "1/4", feedback: 0.3, mix: 0.2, pingpong: true}
  - {type: reverb, size: 0.95, damping: 0.45, mix: 0.45, predelay: 0.04}
