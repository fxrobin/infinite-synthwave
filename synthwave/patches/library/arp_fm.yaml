name: arp_fm
polyphony: 6
volume: 1.2
oscillators:
  - {wave: fm, fm_ratio: 2.0, fm_index: 1.2, level: 0.6}
  - {wave: saw, level: 0.3}
amp_env: {attack: 0.002, decay: 0.28, sustain: 0.05, release: 0.2}
filter:
  type: lp
  cutoff: 1500
  resonance: 0.15
  env: {attack: 0.002, decay: 0.2, sustain: 0.1, release: 0.1, amount: 1200}
effects:
  - {type: phaser, rate: 0.25, depth: 0.6, stages: 4, mix: 0.35}
  - {type: delay, time: "1/8", feedback: 0.5, mix: 0.4, pingpong: true}
  - {type: reverb, size: 0.85, damping: 0.6, mix: 0.25}
