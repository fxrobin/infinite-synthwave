name: lead_saw
polyphony: 1
glide: 0.05
volume: 1.8
oscillators:
  - {wave: saw, unison: 4, detune: 18, level: 0.8, spread: 0.8}
  - {wave: saw, octave: -1, level: 0.35}
amp_env: {attack: 0.03, decay: 0.4, sustain: 0.75, release: 0.45}
filter:
  type: lp
  cutoff: 2200
  resonance: 0.15
  env: {attack: 0.02, decay: 0.5, sustain: 0.5, release: 0.3, amount: 1200}
lfo: {wave: sine, rate: 5.5, target: pitch, amount: 0.12}
effects:
  - {type: chorus, rate: 0.5, depth: 0.004, mix: 0.4}
  - {type: phaser, rate: 0.15, depth: 0.7, stages: 4, mix: 0.4}
  - {type: delay, time: "1/4", feedback: 0.45, mix: 0.35, pingpong: true}
  - {type: reverb, size: 0.85, damping: 0.4, mix: 0.3}
