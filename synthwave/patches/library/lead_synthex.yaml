# Elka Synthex — « Laser Harp » : pulse très fin + saw, résonance vive, delay long ping-pong.
name: lead_synthex
polyphony: 1
glide: 0.02
volume: 0.6
oscillators:
  - {wave: square, pwm: 0.12, level: 0.55}
  - {wave: saw, level: 0.4}
  - {wave: square, pwm: 0.5, octave: -1, level: 0.25}
amp_env: {attack: 0.005, decay: 0.5, sustain: 0.7, release: 0.5}
filter:
  type: lp
  cutoff: 1500
  resonance: 0.4
  env: {attack: 0.005, decay: 0.4, sustain: 0.4, release: 0.4, amount: 2400}
lfo: {wave: sine, rate: 5.8, target: pitch, amount: 0.1}
effects:
  - {type: chorus, rate: 0.4, depth: 0.003, mix: 0.3}
  - {type: delay, time: "1/4d", feedback: 0.55, mix: 0.4, pingpong: true}
  - {type: reverb, size: 0.9, damping: 0.5, mix: 0.3}
