name: lead_hollow
polyphony: 1
glide: 0.06
volume: 1.6
oscillators:
  - {wave: square, pwm: 0.5, unison: 2, detune: 9, level: 0.6}
  - {wave: triangle, level: 0.4}
  - {wave: square, pwm: 0.5, octave: -1, level: 0.25}
amp_env: {attack: 0.04, decay: 0.4, sustain: 0.8, release: 0.5}
filter:
  type: lp
  cutoff: 1400
  resonance: 0.2
  env: {attack: 0.1, decay: 0.8, sustain: 0.5, release: 0.4, amount: 700}
lfo: {wave: sine, rate: 4.5, target: pitch, amount: 0.1}
effects:
  - {type: chorus, rate: 0.6, depth: 0.004, mix: 0.45}
  - {type: phaser, rate: 0.3, depth: 0.7, stages: 4, mix: 0.4}
  - {type: delay, time: "1/8d", feedback: 0.45, mix: 0.35, pingpong: true}
  - {type: reverb, size: 0.88, damping: 0.5, mix: 0.3}
