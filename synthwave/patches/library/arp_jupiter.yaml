name: arp_jupiter
polyphony: 6
volume: 0.8
oscillators:
  - {wave: square, pwm: 0.3, level: 0.55}
  - {wave: saw, unison: 2, detune: 8, level: 0.35}
amp_env: {attack: 0.003, decay: 0.32, sustain: 0.1, release: 0.2}
filter:
  type: lp
  cutoff: 1000
  resonance: 0.3
  env: {attack: 0.002, decay: 0.22, sustain: 0.15, release: 0.1, amount: 1600}
effects:
  - {type: chorus, rate: 0.6, depth: 0.003, mix: 0.35}
  - {type: delay, time: "1/8d", feedback: 0.45, mix: 0.35, pingpong: true}
  - {type: reverb, size: 0.85, damping: 0.5, mix: 0.25}
