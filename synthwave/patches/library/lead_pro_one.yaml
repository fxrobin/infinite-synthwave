# Sequential Pro-One — mono punchy : saw + pulse sync-like, résonance, attaque ultra courte.
name: lead_pro_one
polyphony: 1
glide: 0.05
volume: 0.65
oscillators:
  - {wave: saw, level: 0.55}
  - {wave: square, pwm: 0.25, semi: 0, level: 0.45}
  - {wave: fm, fm_ratio: 1.5, fm_index: 1.0, level: 0.25}
amp_env: {attack: 0.005, decay: 0.35, sustain: 0.75, release: 0.3}
filter:
  type: lp
  cutoff: 1000
  resonance: 0.4
  env: {attack: 0.005, decay: 0.4, sustain: 0.4, release: 0.3, amount: 2200}
lfo: {wave: sine, rate: 5.6, target: pitch, amount: 0.12}
effects:
  - {type: distortion, drive: 2.5, tone: 3800, mix: 0.45}
  - {type: delay, time: "1/8", feedback: 0.4, mix: 0.3, pingpong: true}
  - {type: reverb, size: 0.85, damping: 0.55, mix: 0.25}
