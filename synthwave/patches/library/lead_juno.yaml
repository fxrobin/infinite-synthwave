# Roland Juno-106 — DCO saw + sub square, PWM lente, chorus BBD « I » : doux et vintage.
name: lead_juno
polyphony: 1
glide: 0.03
volume: 1.05
oscillators:
  - {wave: saw, level: 0.6}
  - {wave: square, pwm: 0.45, level: 0.4}
  - {wave: square, pwm: 0.5, octave: -1, level: 0.35}
amp_env: {attack: 0.03, decay: 0.4, sustain: 0.8, release: 0.5}
filter:
  type: lp
  cutoff: 1100
  resonance: 0.15
  env: {attack: 0.03, decay: 0.8, sustain: 0.5, release: 0.4, amount: 1300}
lfo: {wave: triangle, rate: 0.5, target: pwm, amount: 0.35}
effects:
  - {type: chorus, rate: 0.5, depth: 0.004, mix: 0.5}
  - {type: delay, time: "1/8d", feedback: 0.4, mix: 0.3, pingpong: true}
  - {type: reverb, size: 0.85, damping: 0.5, mix: 0.3}
