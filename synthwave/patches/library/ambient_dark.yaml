name: ambient_dark
polyphony: 3
volume: 0.5
oscillators:
  - {wave: noise, level: 0.45}
  - {wave: fm, fm_ratio: 0.5, fm_index: 0.35, octave: -1, level: 0.55}
  - {wave: sine, octave: -2, level: 0.4}
amp_env: {attack: 3.0, decay: 1.0, sustain: 0.9, release: 4.0}
filter:
  type: lp
  cutoff: 420
  resonance: 0.25
lfo: {wave: triangle, rate: 0.05, target: cutoff, amount: 320}
effects:
  - {type: chorus, rate: 0.15, depth: 0.008, mix: 0.5}
  - {type: reverb, size: 1.0, damping: 0.7, mix: 0.65, predelay: 0.05}
