# Néon : saws détunées de registre médium, phaser lent, halo brillant sans agressivité.
name: ambient_neon
polyphony: 3
volume: 0.36
oscillators:
  - {wave: saw, unison: 4, detune: 14, level: 0.5, spread: 1.0}
  - {wave: square, pwm: 0.4, octave: -1, level: 0.25}
  - {wave: sine, octave: 1, level: 0.15}
amp_env: {attack: 3.0, decay: 1.0, sustain: 0.9, release: 4.5}
filter:
  type: lp
  cutoff: 1400
  resonance: 0.18
lfo: {wave: sine, rate: 0.11, target: cutoff, amount: 500}
effects:
  - {type: phaser, rate: 0.06, depth: 0.9, stages: 6, mix: 0.55, feedback: 0.45}
  - {type: chorus, rate: 0.25, depth: 0.006, mix: 0.5}
  - {type: reverb, size: 1.0, damping: 0.45, mix: 0.6, predelay: 0.05}
