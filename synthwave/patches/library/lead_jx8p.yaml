# Roland JX-8P — brass/lead synthpop 1985 : saws croisées, attaque courte, chorus, cutoff médium.
name: lead_jx8p
polyphony: 1
glide: 0.03
volume: 1.2
oscillators:
  - {wave: saw, unison: 2, detune: 7, level: 0.6, spread: 0.5}
  - {wave: saw, semi: 0, level: 0.3}
  - {wave: square, pwm: 0.35, octave: -1, level: 0.3}
amp_env: {attack: 0.04, decay: 0.5, sustain: 0.8, release: 0.4}
filter:
  type: lp
  cutoff: 1200
  resonance: 0.2
  env: {attack: 0.06, decay: 0.7, sustain: 0.5, release: 0.4, amount: 1500}
lfo: {wave: sine, rate: 5.0, target: pitch, amount: 0.1}
effects:
  - {type: chorus, rate: 0.6, depth: 0.003, mix: 0.4}
  - {type: delay, time: "1/4", feedback: 0.35, mix: 0.3, pingpong: true}
  - {type: reverb, size: 0.86, damping: 0.5, mix: 0.3}
