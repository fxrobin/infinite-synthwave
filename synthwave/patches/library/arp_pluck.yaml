name: arp_pluck
polyphony: 6
volume: 0.8
oscillators:
  - {wave: saw, unison: 2, detune: 8, level: 0.8}
  - {wave: square, octave: 1, level: 0.2, pwm: 0.3}
amp_env: {attack: 0.003, decay: 0.38, sustain: 0.05, release: 0.2}
filter:
  type: lp
  cutoff: 900
  resonance: 0.3
  env: {attack: 0.002, decay: 0.25, sustain: 0.1, release: 0.1, amount: 2200}
effects:
  - {type: chorus, rate: 0.4, depth: 0.003, mix: 0.35}
  - {type: delay, time: "1/8d", feedback: 0.35, mix: 0.3, pingpong: true}
  - {type: reverb, size: 0.7, damping: 0.5, mix: 0.2}
