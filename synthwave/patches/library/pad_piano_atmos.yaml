name: pad_piano_atmos
polyphony: 8
volume: 0.7
oscillators:
  - {wave: sine, level: 0.6}
  - {wave: fm, fm_ratio: 2.0, fm_index: 0.18, level: 0.35}         # soft 2nd partial (struck string)
  - {wave: triangle, octave: 1, level: 0.06}
amp_env: {attack: 0.06, decay: 2.2, sustain: 0.3, release: 2.0}
filter:
  type: lp
  cutoff: 1300
  resonance: 0.0
  key_track: 0.5
  env: {attack: 0.005, decay: 0.6, sustain: 0.25, release: 0.8, amount: 700}
lfo: {wave: sine, rate: 0.25, target: pitch, amount: 0.015}         # gentle tape drift
effects:
  - {type: chorus, rate: 0.15, depth: 0.0015, mix: 0.2}
  - {type: delay, time: "1/4d", feedback: 0.25, mix: 0.15, pingpong: true}
  - {type: reverb, size: 0.96, damping: 0.6, mix: 0.45, predelay: 0.04}
