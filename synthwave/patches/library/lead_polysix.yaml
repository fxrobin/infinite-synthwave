# Korg Polysix — saw + sub, ensemble/chorus épais : lead rond et laiteux.
name: lead_polysix
polyphony: 1
glide: 0.05
volume: 1.5
oscillators:
  - {wave: saw, unison: 2, detune: 8, level: 0.6, spread: 0.6}
  - {wave: square, pwm: 0.5, octave: -1, level: 0.4}
  - {wave: triangle, level: 0.25}
amp_env: {attack: 0.05, decay: 0.5, sustain: 0.8, release: 0.6}
filter:
  type: lp
  cutoff: 1000
  resonance: 0.12
  env: {attack: 0.05, decay: 0.9, sustain: 0.5, release: 0.5, amount: 1200}
lfo: {wave: sine, rate: 4.6, target: pitch, amount: 0.1}
effects:
  - {type: chorus, rate: 0.7, depth: 0.005, mix: 0.6}
  - {type: delay, time: "1/4", feedback: 0.4, mix: 0.3, pingpong: true}
  - {type: reverb, size: 0.9, damping: 0.5, mix: 0.35}
