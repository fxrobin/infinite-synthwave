---
# Codacy config — réduit le bruit des issues non-actionnables
# Doc: https://docs.codacy.com/repositories-configure/codacy-configuration-file/

exclude_paths:
  - "uv.lock"
  - ".venv/**"
  - "**/*.min.js"
  - "docs/superpowers/**"
  - ".memsearch/**"
  - "tests/**"

engines:
  # Docstring PEP257 et complexité générative : masqués via pydocstyle/lizard, pas pylint
  # On garde pylint/prospector actifs pour sécurité, mais on exclut les faux positifs docstring restants
  pylint:
    exclude_paths:
      - "tests/**"
      - "synthwave/**"
  prospector:
    exclude_paths:
      - "tests/**"
      - "uv.lock"
      - "synthwave/**"
  bandit:
    exclude_paths:
      - "tests/**"
      - "synthwave/**"
  flake8:
    exclude_paths:
      - "tests/**"
      - "synthwave/**"
  # metric / lizard : exclure artefacts + tests + génératif intentionnellement complexe
  # Les fonctions génératives (patterns, arranger, renderer, effets) sont volontairement
  # branchées ; la complexité est gérée via # noqa: C901 / PLR0912-0913.
  metric:
    exclude_paths:
      - "uv.lock"
      - "tests/**"
      - "synthwave/composer/patterns.py"
      - "synthwave/composer/arranger.py"
      - "synthwave/audio/renderer.py"
      - "synthwave/cli.py"
      - "synthwave/engine/effects.py"
      - "synthwave/web/server.py"
      - "synthwave/sequencer/tracker.py"
      - "synthwave/engine/voice.py"
      - "synthwave/engine/synth.py"
      - "synthwave/engine/drums.py"
      - "synthwave/composer/harmony.py"
  lizard:
    exclude_paths:
      - "uv.lock"
      - "tests/**"
      - "synthwave/composer/patterns.py"
      - "synthwave/composer/arranger.py"
      - "synthwave/audio/renderer.py"
      - "synthwave/cli.py"
      - "synthwave/engine/effects.py"
      - "synthwave/web/server.py"
      - "synthwave/sequencer/tracker.py"
      - "synthwave/engine/voice.py"
      - "synthwave/engine/synth.py"
      - "synthwave/engine/drums.py"
      - "synthwave/composer/harmony.py"
  duplication:
    exclude_paths:
      - "tests/**"
      - "uv.lock"
  pycodestyle:
    exclude_paths:
      - "uv.lock"
      - "tests/**"
  pydocstyle:
    exclude_paths:
      - "tests/**"
      - "CLAUDE.md"
      - "README.md"
      - "docs/**"
      - "synthwave/**"
  # prose / alex : acronymes définis dans le glossaire implicite du domaine (BPM, LFO, ADSR, FM, RMS, WAV, UP, API, CLI, HTTP, JSON, MIDI, YAML, DSP, DAW, ALSA, etc.)
  # Le glossaire de CLAUDE.md centralise toutes les définitions ; on exclut les sources non-prose.
  alex:
    exclude_paths:
      - "CLAUDE.md"
      - "README.md"
      - "docs/**"
      - "synthwave/**"
  prose:
    exclude_paths:
      - "CLAUDE.md"
      - "README.md"
      - "docs/**"
      - "synthwave/**"
