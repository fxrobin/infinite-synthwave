---
# Codacy config — réduit le bruit des issues non-actionnables
# Doc: https://docs.codacy.com/repositories-configure/codacy-configuration-file/

exclude_paths:
  - "uv.lock"
  - ".venv/**"
  - "**/*.min.js"
  - "docs/superpowers/**"
  - ".memsearch/**"
  - "tests/**"

engines:
  # "Use of assert" (bandit B101 / pylint) est légitime dans les tests
  pylint:
    exclude_paths:
      - "tests/**"
      - "synthwave/composer/patterns.py"
      - "synthwave/composer/arranger.py"
      - "synthwave/audio/renderer.py"
  prospector:
    exclude_paths:
      - "tests/**"
      - "uv.lock"
      - "synthwave/composer/patterns.py"
      - "synthwave/composer/arranger.py"
  bandit:
    exclude_paths:
      - "tests/**"
  flake8:
    exclude_paths:
      - "tests/**"
  # metric / lizard : exclure artefacts + tests + génératif intentionnellement complexe
  metric:
    exclude_paths:
      - "uv.lock"
      - "tests/**"
      - "synthwave/composer/patterns.py"
      - "synthwave/composer/arranger.py"
      - "synthwave/audio/renderer.py"
  lizard:
    exclude_paths:
      - "uv.lock"
      - "tests/**"
      - "synthwave/composer/patterns.py"
      - "synthwave/composer/arranger.py"
      - "synthwave/audio/renderer.py"
  duplication:
    exclude_paths:
      - "tests/**"
      - "uv.lock"
  pycodestyle:
    exclude_paths:
      - "uv.lock"
      - "tests/**"
  pydocstyle:
    exclude_paths:
      - "tests/**"
      - "CLAUDE.md"
      - "README.md"
      - "docs/**"
  # prose / alex : acronymes définis dans le glossaire implicite du domaine (BPM, LFO, ADSR, FM, RMS, WAV, UP)
  alex:
    exclude_paths:
      - "CLAUDE.md"
      - "README.md"
      - "docs/**"
  prose:
    exclude_paths:
      - "CLAUDE.md"
      - "README.md"
      - "docs/**"
